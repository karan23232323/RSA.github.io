<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join RSA Telegram Channel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .subtitle {
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .title {
            font-size: 32px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 20px;
            background: linear-gradient(to right, #ffffff, #e2e8f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .description {
            color: #94a3b8;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 35px;
        }
        .timer-box {
            margin-bottom: 35px;
        }
        .timer-number {
            font-size: 72px;
            font-weight: 800;
            color: #38bdf8;
            line-height: 1;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            animation: pulse 1s infinite alternate;
        }
        .timer-text {
            color: #64748b;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 8px;
            font-weight: 600;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #06b6d4 0%, #10b981 100%);
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 8px 20px rgba(6, 182, 212, 0.3);
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(6, 182, 212, 0.5);
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="subtitle">Telegram Channel</div>
        <h1 class="title">Join RSA</h1>
        <p class="description">Quick access to the channel. Tap below before the timer ends.</p>
        
        <div class="timer-box">
            <div id="countdown" class="timer-number">10</div>
            <div class="timer-text">Seconds Left</div>
        </div>

        <a href="https://t.me/+ujDm9A4O9Ho2YzA9" id="join-btn" class="btn">Join Telegram</a>
    </div>

    <script>
        const targetURL = "https://t.me/+ujDm9A4O9Ho2YzA9";
        let timeLeft = 10;
        const countdownEl = document.getElementById('countdown');

        const timer = setInterval(() => {
            timeLeft--;
            countdownEl.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timer);
                window.location.href = targetURL;
            }
        }, 1000);
    </script>

</body>
</html>
